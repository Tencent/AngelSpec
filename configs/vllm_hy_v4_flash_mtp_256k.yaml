# Hy4 flash MTP head with 5 TTT steps, 256k — 32 GPUs (4 nodes x 8).
#   Draft: mtp_hy_v4_flash (MLA + compressed-indexer DSA + latent MoE), warm-started from
#          target layer 41 on the TileLang DSA kernels.
#   Inference: 2 nodes = 2 replicas x TP8.
#   Training:  2 nodes (16 GPUs) = USP SP16/DP1, FSDP FULL_SHARD over all 16 ranks.
# Global batch 256 (256 samples accumulated per step).
# Requires HY_V4_FLASH_TARGET_MODEL, HY_V4_FLASH_TRAIN_DATA and ANGELSPEC_RUN_DIR (output and
# cache go there). Launch on one 4-node Ray cluster:
#   ANGELSPEC_NUM_NODES=4 ANGELSPEC_TRAIN_NODES=2 ANGELSPEC_INFER_NODES=2 \
#   bash scripts/ops/cluster.sh restart configs/vllm_hy_v4_flash_mtp_256k.yaml
model:
  target_model_path: ${oc.env:HY_V4_FLASH_TARGET_MODEL,/path/to/hy-v4-flash}
  draft_model_config: angelspec/config/mtp_hy_v4_flash_draft_config.json
  trust_remote_code: true

dataset:
  train_data_path: ${oc.env:HY_V4_FLASH_TRAIN_DATA,/path/to/train.jsonl}
  eval_data_path: null
  chat_template: hy4-think
  prompt_key: conversations
  min_loss_tokens: 32

training:
  training_num_nodes: 2
  training_num_gpus_per_node: 8
  sp_ulysses_size: 16
  sp_ring_size: 1
  draft_accumulation_steps: 256
  attention_backend: usp
  distributed_timeout_minutes: 30
  usp_local_shard: true
  sp_leader_mooncake_fetch: true
  micro_batch_size: 1
  optimizer_type: muon
  learning_rate: 5e-4
  min_lr: 5e-5
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  warmup_ratio: 0.0
  lr_decay_style: cosine
  max_concurrent_batches: 1
  prefetch_depth: 6
  max_seq_length: 262143
  num_epochs: 1
  num_train_steps: null
  seed: 42
  ttt_length: 5
  ploss_weights: [0.434, 0.260, 0.156, 0.094, 0.056]  # 0.6^i normalised
  mtp_draft_input_postnorm: true
  mtp_ttt_on_policy: true
  mtp_packing: false
  fsdp_strategy: FULL_SHARD
  hsdp_shard_size: 16
  fsdp_backward_prefetch: false
  fsdp_reduce_dtype: bfloat16
  gradient_checkpointing: true
  save_interval: 500
  max_checkpoints: 2
  save_per_epoch: false
  continual_training: false
  load_path: null
  train_env_vars: '{"PYTORCH_CUDA_ALLOC_CONF": "expandable_segments:True", "ANGELSPEC_MTP_LOSS_CHUNK": "128", "ANGELSPEC_MTP_SAC": "1"}'

inference:
  inference_num_gpus: 16
  inference_num_gpus_per_engine: 8
  inference_num_gpus_per_node: 8
  inference_engine_type: vllm
  # A step dispatches all 256 samples before training consumes any, so the pool must hold
  # a global batch.
  max_sample_pool_size: 256
  max_sample_pool_bytes: 256GB
  inference_buffer_threshold: 64
  inference_batch_size: 2
  inference_fetch_batch: 1
  vllm:
    data_parallel_size: 1
    tp_size: 8
    pp_size: 1
    nnodes: 1  # single-node replicas use the mp executor; ray is for nnodes > 1
    mem_fraction_static: 0.85
    disable_custom_all_reduce: false
    init_timeout: 4800
    env_vars:
      ANGELSPEC_VLLM_HS_CHUNK_TOKENS: "16384"
    enable_multimodal: true
    mm_processor_kwargs:
      min_pixels: 4096
      max_pixels: 4194304
    limit_mm_per_prompt:
      image: 128
      video: 8
    extra_args:
      async_scheduling: false
      block_size: 64
      max_model_len: 262144
      enable_chunked_prefill: true
      max_num_batched_tokens: 16384
      enforce_eager: true
      kernel_config:
        moe_backend: triton
      # Engram tables stay on the GPU: offloading pins them in host memory, which
      # containers often cap.
      engram_config:
        cpu_offload: false

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 512GB
  local_buffer_size: 32GB
  async_put_pool_size: 1
  enable_hard_pin: false
  kv_lease_ttl_s: 3600
  get_retry_max_wait_seconds: 900

output_dir: ${oc.env:ANGELSPEC_RUN_DIR}/mtp
cache_dir: ${oc.env:ANGELSPEC_RUN_DIR}/cache

logging:
  report_to: none

debug:
  enable_perf_metrics: true
