# Hy4 DFly2 drafter, 64k packed rows, 48 GPUs (6 nodes x 8).
#   Inference: 4 nodes, DP4 x TP8.
#   Training:  2 nodes, USP SP8 x DP2.
# Requires HY_V4_TARGET_MODEL, HY_V4_TRAIN_DATA and ANGELSPEC_RUN_DIR. Launch:
#   ANGELSPEC_NUM_NODES=6 ANGELSPEC_TRAIN_NODES=2 ANGELSPEC_INFER_NODES=4 \
#   bash scripts/ops/cluster.sh restart configs/vllm_hy_v4_dfly2_64k.yaml
model:
  target_model_path: ${oc.env:HY_V4_TARGET_MODEL,/path/to/hy-v4}
  draft_model_config: angelspec/config/dfly2_hy_v4_draft_config.json
  trust_remote_code: true

dataset:
  train_data_path: ${oc.env:HY_V4_TRAIN_DATA,/path/to/train.jsonl}
  eval_data_path: null
  chat_template: hy4-think
  prompt_key: conversations
  min_loss_tokens: 32

training:
  training_num_nodes: 2
  training_num_gpus_per_node: 8
  attention_backend: usp
  sp_ulysses_size: 8
  sp_ring_size: 1
  usp_local_shard: true
  sp_leader_mooncake_fetch: true
  hsdp_shard_sp: 8
  micro_batch_size: 1
  draft_accumulation_steps: 8
  distributed_timeout_minutes: 30
  optimizer_type: muon
  learning_rate: 5e-4
  min_lr: 5e-5
  weight_decay: 0.01
  muon_weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_concurrent_batches: 1
  prefetch_depth: 1
  max_grad_norm: 1.0
  max_seq_length: 65536
  num_epochs: 1
  num_train_steps: null
  seed: 42
  gradient_checkpointing: false
  dflash_packing: true
  fsdp_strategy: FULL_SHARD
  fsdp_reduce_dtype: float32
  fsdp_backward_prefetch: true
  train_env_vars: '{"PYTORCH_CUDA_ALLOC_CONF": "expandable_segments:True,garbage_collection_threshold:0.8", "OMP_NUM_THREADS": "16"}'
  warmup_ratio: 0.04
  save_interval: 500
  save_per_epoch: false
  max_checkpoints: 2
  continual_training: false
  load_path: null
  dflash_block_size: 7
  dflash_num_anchors: 640
  dflash_loss_objective: dpace
  dflash_dpace_alpha: 0.5
  dflash_ce_loss_alpha: 0.0
  dflash_l1_loss_alpha: 0.0
  dflash_kl_loss_weight: 1.0
  dflash_e2e_tv_loss_weight: 1.0
  dflash_e2e_tv_vocab_chunk: 8192
  dspark_confidence_head_alpha: 1.0
  compile_model: false
  dflash_causal_attn: true

inference:
  inference_num_gpus: 32
  inference_num_gpus_per_engine: 32
  inference_num_gpus_per_node: 8
  inference_engine_type: vllm
  store_last_hidden_states: true
  max_sample_pool_size: 512
  max_sample_pool_bytes: 384GB
  inference_buffer_threshold: 64
  inference_batch_size: 32
  inference_fetch_batch: 1
  vllm:
    data_parallel_size: 4
    tp_size: 8
    pp_size: 1
    mem_fraction_static: 0.95
    init_timeout: 4800
    env_vars:
      ANGELSPEC_VLLM_HS_CHUNK_TOKENS: "16384"
    enable_multimodal: true
    mm_processor_kwargs:
      min_pixels: 4096
      max_pixels: 4194304
    limit_mm_per_prompt:
      image: 128
      video: 8
    extra_args:
      enable_expert_parallel: true
      async_scheduling: false
      attention_backend: FLASHMLA_SPARSE
      block_size: 64
      max_model_len: 65536
      enable_chunked_prefill: true
      max_num_batched_tokens: 8192
      enforce_eager: true
      kernel_config:
        moe_backend: triton

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 768GB
  local_buffer_size: 64GB
  async_put_pool_size: 1
  enable_hard_pin: false
  kv_lease_ttl_s: 3600
  get_retry_max_wait_seconds: 900

output_dir: ${oc.env:ANGELSPEC_RUN_DIR}/dfly2_hy_v4
cache_dir: ${oc.env:ANGELSPEC_RUN_DIR}/cache

logging:
  report_to: none

debug:
  enable_perf_metrics: true
