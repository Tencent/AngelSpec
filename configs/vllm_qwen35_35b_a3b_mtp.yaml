model:
  target_model_path: ${oc.env:QWEN35_35B_TARGET_MODEL,/path/to/qwen3.5-35b-a3b}
  trust_remote_code: true
  draft_model_config: angelspec/config/mtp_qwen35_35b_a3b_draft_config.json
  lm_head_key: lm_head.weight
  norm_key: model.language_model.norm.weight
  embedding_key: model.language_model.embed_tokens.weight

dataset:
  train_data_path: ../examples/data/sample_conversations.jsonl
  eval_data_path: null
  chat_template: qwen3-vl
  prompt_key: conversations
  defer_tokenization: true
  num_proc: 16
  min_loss_tokens: 8

training:
  mtp_packing: true
  attention_backend: usp
  sp_ulysses_size: 4
  sp_ring_size: 1
  usp_local_shard: true
  fsdp_strategy: REPLICATE
  micro_batch_size: 1
  prefetch_depth: 0
  draft_accumulation_steps: 1
  learning_rate: 6e-4
  min_lr: 6e-5
  weight_decay: 0.01
  max_concurrent_batches: 1
  max_grad_norm: 1.0
  max_seq_length: 4096
  num_epochs: 1
  num_train_steps: 20
  seed: 42
  training_num_gpus_per_node: 4
  training_num_nodes: 1
  ttt_length: 4
  ploss_weights: [0.25, 0.25, 0.25, 0.25]
  mtp_ttt_on_policy: true
  mtp_draft_input_postnorm: true
  fsdp_reduce_dtype: bfloat16
  warmup_ratio: 0.04
  gradient_checkpointing: true
  save_interval: 100000
  save_per_epoch: false
  continual_training: false
  distributed_timeout_minutes: 60

inference:
  inference_engine_type: vllm
  inference_num_gpus: 4
  inference_num_gpus_per_engine: 4
  inference_num_gpus_per_node: 8
  max_sample_pool_size: 128
  inference_buffer_threshold: 32
  inference_batch_size: 4
  vllm:
    tp_size: 4
    enable_multimodal: false
    limit_mm_per_prompt:
      image: 10
    mem_fraction_static: 0.9
    init_timeout: 1800
    extra_args:
      max_num_batched_tokens: 8192
      enforce_eager: true
      kernel_config:
        moe_backend: triton

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 32GB
  local_buffer_size: 8GB
  enable_hard_pin: true

output_dir: ./outputs/qwen35-35b-mtp
cache_dir: ./cache/qwen35-35b-mtp
model_download_dir: null

logging:
  report_to: none

debug:
  save_debug_train_data: null
  debug_train_only: false
  debug_inference_only: false
