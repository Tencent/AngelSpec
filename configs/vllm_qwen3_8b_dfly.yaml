model:
  target_model_path: ${oc.env:TS_SHARE_ROOT,/path/to/share}/model/Qwen_Qwen3-8B
  trust_remote_code: true
  draft_model_config: angelspec/config/dfly_qwen3_8b_draft_config.json
  lm_head_key: lm_head.weight

dataset:
  train_data_path: ../examples/data/sample_conversations.jsonl
  eval_data_path: null
  chat_template: qwen
  prompt_key: conversations
  min_loss_tokens: 32

training:
  attention_backend: flex_attention
  micro_batch_size: 1
  draft_accumulation_steps: 1
  learning_rate: 5e-4
  min_lr: 5e-5
  weight_decay: 0.1
  max_concurrent_batches: 1
  max_grad_norm: 1.0
  max_seq_length: 2048
  num_epochs: 1
  num_train_steps: null
  seed: 42
  ttt_length: 7
  fsdp_strategy: FULL_SHARD
  fsdp_reduce_dtype: bfloat16
  warmup_ratio: 0.04
  save_interval: 100000
  save_per_epoch: false
  max_checkpoints: 1
  distributed_timeout_minutes: 30

  training_num_nodes: 1
  training_num_gpus_per_node: 4

  dflash_block_size: 16
  dflash_num_target_layers: 5
  dflash_num_anchors: 128

  # Loss 策略（两阶段）：
  #   冷启动阶段（当前配置）：纯 lk-loss（不用 CE），dpace 位置加权
  #   最终阶段：dflash_lk_loss_weight=0.0，dflash_e2e_tv_loss_weight=1.0
  dflash_loss_objective: dpace     # dpace 续接价值加权（作用于 lk 的位置权重）
  dflash_dpace_alpha: 0.5
  dflash_lk_loss_weight: 1.0       # =1.0 时 loss=lk，完全不含 CE
  dflash_lk_loss_type: hybrid
  dflash_e2e_tv_loss_weight: 0.0

inference:
  inference_engine_type: vllm
  store_last_hidden_states: true
  inference_num_gpus: 4
  inference_num_gpus_per_engine: 4
  inference_num_gpus_per_node: 4
  max_sample_pool_size: 64
  inference_buffer_threshold: 32
  inference_batch_size: 8
  vllm:
    tp_size: 4
    mem_fraction_static: 0.85
    extra_args:
      max_num_batched_tokens: 8192

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 16GB
  local_buffer_size: 4GB
  enable_hard_pin: true

output_dir: ./outputs/qwen3-8b-dfly
cache_dir: ./cache/qwen3-8b-dfly
model_download_dir: null

logging:
  report_to: none

debug:
  save_debug_train_data: null
  debug_train_only: false
  debug_inference_only: false
