model:
  target_model_path: ${oc.env:TS_SHARE_ROOT,/path/to/share}/model/tencent_Hy3
  trust_remote_code: true
  draft_model_config: angelspec/config/dfly_hy3_draft_config.json
  lm_head_key: model.embed_tokens.weight

dataset:
  train_data_path: /path/to/data/train.jsonl
  eval_data_path: null
  chat_template: hy3
  prompt_key: conversations
  min_loss_tokens: 32

training:
  attention_backend: flex_attention
  micro_batch_size: 1
  draft_accumulation_steps: 1
  learning_rate: 5e-4
  min_lr: 5e-5
  weight_decay: 0.1
  max_concurrent_batches: 1
  max_grad_norm: 1.0
  max_seq_length: 8192
  num_epochs: 1
  num_train_steps: null
  seed: 42
  ttt_length: 7
  fsdp_strategy: FULL_SHARD
  fsdp_reduce_dtype: bfloat16
  warmup_ratio: 0.04
  save_interval: 1000
  save_per_epoch: false
  max_checkpoints: 2
  distributed_timeout_minutes: 30

  training_num_nodes: 2
  training_num_gpus_per_node: 4

  dflash_block_size: 16
  dflash_num_target_layers: 5
  dspark_num_anchors: 128
  dspark_num_target_layers: 5
  dspark_loss_decay_gamma: 4.0
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0

inference:
  inference_engine_type: vllm
  store_last_hidden_states: true
  inference_num_gpus: 8
  inference_num_gpus_per_engine: 4
  inference_num_gpus_per_node: 8
  max_sample_pool_size: 64
  inference_buffer_threshold: 32
  inference_batch_size: 4
  vllm:
    tp_size: 4
    mem_fraction_static: 0.8
    extra_args:
      max_num_batched_tokens: 8192
      enforce_eager: true

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 16GB
  local_buffer_size: 4GB
  enable_hard_pin: true

output_dir: ./outputs/hy3-dfly
cache_dir: ./cache/hy3-dfly
model_download_dir: null

logging:
  report_to: none

debug:
  save_debug_train_data: null
  debug_train_only: false
  debug_inference_only: false
